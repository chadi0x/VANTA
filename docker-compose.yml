version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vanta_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vanta_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vanta_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vanta_db}
    ports:
      - "5432:5432"
    volumes:
      - vanta_pgdata:/var/lib/postgresql/data
      - ./apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vanta_admin} -d ${POSTGRES_DB:-vanta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vanta_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - vanta_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vanta_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-vanta_admin}:${POSTGRES_PASSWORD:-vanta_secure_2026}@postgres:5432/${POSTGRES_DB:-vanta_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-vanta_terminal_jwt_ultra_secret_2026_key}
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  scraper-worker:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    container_name: vanta_scraper
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://api:4000
      SCRAPE_INTERVAL_MS: 30000
      PROXY_LIST: ""
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vanta_web
    restart: always
    depends_on:
      - api
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  vanta_pgdata:
  vanta_redisdata:
